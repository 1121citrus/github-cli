# Grype scan configuration for github-cli.
#
# Ignored entries fall into two categories:
#   1. Transitive Go module dependencies compiled into the `gh` binary by the
#      Alpine package maintainer.  Fixes require cli/cli to update its go.mod.
#   2. Transitive Alpine edge package dependencies.  Cannot be removed at the
#      image level.
#
# The Grype DB reports many Go module vulnerabilities under both a CVE ID and
# one or more GHSA advisory IDs simultaneously.  All known aliases for each
# vulnerability are listed together under the same comment block.
#
# All entries are documented in SECURITY.md §"Known Unfixable CVEs".
#
# Only Critical/High findings block the build; Medium/Low are advisory only.

fail-on-severity: "high"

ignore:

  # ── Alpine package dependencies ─────────────────────────────────────────────

  # python 3.14.x — CRITICAL CVE-2026-6100; no fix available (2026-05-03).
  # Python is a transitive Alpine edge dependency of the `github-cli` apk
  # package and cannot be removed from the image.
  - vulnerability: CVE-2026-6100
    package:
      name: python
      type: binary

  # busybox 1.37.0-r31 — MEDIUM CVE-2025-60876; no fix in Alpine edge yet.
  # apk upgrade runs at build time; remove this entry when Alpine ships a patch.
  - vulnerability: CVE-2025-60876
    package:
      name: busybox
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: busybox-binsh
      type: apk
  - vulnerability: CVE-2025-60876
    package:
      name: ssl_client
      type: apk

  # ── Go module dependencies ───────────────────────────────────────────────────

  # google.golang.org/grpc 1.77.0 — CRITICAL; fix: 1.79.3
  # CVE-2026-33186 / GHSA-p77j-4mvh-x3m3
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2026-33186
    package:
      name: google.golang.org/grpc
      type: go-module
  - vulnerability: GHSA-p77j-4mvh-x3m3
    package:
      name: google.golang.org/grpc
      type: go-module

  # github.com/docker/cli 29.0.3 — HIGH; fix: 29.2.0
  # CVE-2025-15558 / GHSA-p436-gjf2-799p
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2025-15558
    package:
      name: github.com/docker/cli
      type: go-module
  - vulnerability: GHSA-p436-gjf2-799p
    package:
      name: github.com/docker/cli
      type: go-module

  # github.com/sigstore/timestamp-authority 1.2.9 — HIGH; fix: 2.0.3
  # CVE-2025-66564 / GHSA-4qg8-fj49-pxjh
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2025-66564
