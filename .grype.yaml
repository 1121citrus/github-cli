  # ── Go toolchain / golang.org/x/net (compiled into gh binary) ───────────────
  #
  # The `github-cli` Alpine edge apk package (2.102.0-r0, built 2026-09-30)
  # embeds Go stdlib go1.27.1 and golang.org/x/net v0.58.0 at compile time.
  # Fixes exist upstream (Go 1.26.9/1.27.2, x/net 0.60.0) but require Alpine's
  # package maintainer to rebuild `github-cli` against the patched toolchain;
  # confirmed 2026-10-29 via pkgs.alpinelinux.org/package/edge/community that
  # no newer build is published yet.  Grype reports several of these under
  # both a GO- id and a CVE alias, and under both `stdlib` and
  # `golang.org/x/net` directly (x/net's HTTP/2 implementation is vendored
  # into net/http).

