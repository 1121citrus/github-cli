# Grype scan configuration for github-cli.
#
# All ignored entries are transitive Go module dependencies compiled into the
# `gh` binary by the Alpine package maintainer.  They cannot be patched at the
# image level; fixes require cli/cli to update its go.mod and Alpine to rebuild
# the package.  All entries are documented in SECURITY.md §"Known Unfixable
# CVEs".
#
# Only Critical/High findings block the build; Medium/Low are advisory only.

fail-on-severity: "high"

ignore:

  # google.golang.org/grpc 1.77.0 — CRITICAL CVE-2026-33186; fix: 1.79.3
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2026-33186
    package:
      name: google.golang.org/grpc
      type: go-module

  # github.com/docker/cli 29.0.3 — HIGH CVE-2025-15558; fix: 29.2.0
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2025-15558
    package:
      name: github.com/docker/cli
      type: go-module
  - vulnerability: GHSA-p436-gjf2-799p
    package:
      name: github.com/docker/cli
      type: go-module

  # github.com/sigstore/timestamp-authority 1.2.9 — HIGH CVE-2025-66564; fix: 2.0.3
  # Only exercised by gh attestation sub-commands.
  - vulnerability: CVE-2025-66564
    package:
      name: github.com/sigstore/timestamp-authority
      type: go-module
  - vulnerability: GHSA-4qg8-fj49-pxjh
    package:
